<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D To Do List Sign In</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f6f7fb;
        color: #14151a;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #111318;
          color: #f3f5f8;
        }
      }

      body {
        align-items: center;
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
      }

      main {
        margin: 0 auto;
        max-width: 420px;
        text-align: center;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0 0 10px;
      }

      p {
        color: color-mix(in srgb, currentColor 72%, transparent);
        line-height: 1.55;
        margin: 0 0 22px;
      }

      a {
        align-items: center;
        background: #5c7cfa;
        border-radius: 8px;
        color: #ffffff;
        display: inline-flex;
        font-weight: 700;
        min-height: 44px;
        padding: 0 18px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Opening D To Do List</h1>
      <p>If the app does not open automatically, tap the button below.</p>
      <a id="openApp" href="com.dtoodolist.mobile://auth/callback">Open app</a>
    </main>

    <script>
      const appUrl = new URL("com.dtoodolist.mobile://auth/callback");
      appUrl.search = window.location.search;
      appUrl.hash = window.location.hash;

      const target = appUrl.toString();
      document.getElementById("openApp").href = target;
      window.location.replace(target);
    </script>
  </body>
</html>
